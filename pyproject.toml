[project]
name = "adhikar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Curious", email = "devansh14341@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.2",
    "sarvamai>=0.1.44",
    "sounddevice>=0.5.6",
    "websockets>=17.3",
]

[project.scripts]
adhikar = "adhikar:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
]
